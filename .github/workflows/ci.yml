name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: |
          node --check assets/app.js
          node --check data/metrics.js
      - name: Data file loads and has the expected shape
        run: |
          node -e "
            global.window = {};
            require('./data/metrics.js');
            const d = window.DASHBOARD_DATA;
            const need = ['kpis','csfMaturity','riskRegister','incidents','vulnerabilities','compliance','topRisks','initiatives','budget'];
            for (const k of need) if (!(k in d)) throw new Error('missing key ' + k);
            if (d.csfMaturity.functions.length !== d.csfMaturity.current.length) throw new Error('csfMaturity arrays differ');
            if (d.budget.planned.length !== d.budget.spent.length) throw new Error('budget arrays differ');
            console.log('OK', d.kpis.length, 'KPIs,', d.topRisks.length, 'risks');
          "
      - name: No unpinned or non-integrity third-party scripts
        run: |
          ! grep -E '<script src="https?://' index.html | grep -v 'integrity="sha384-' || (echo "every external script needs an integrity attribute" && exit 1)
      - name: HTML validation
        run: npx --yes html-validate@8 index.html
